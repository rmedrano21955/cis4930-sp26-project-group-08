{% extends "base.html" %}

{% block content %}

<h2 class="mb-3">Data List</h2>

<table class="table table-striped table-hover">
    <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Description</th>
        </tr>
    </thead>

    <tbody>
        {% for item in items %}
        <tr>
            <td>{{ item.id }}</td>
            <td>{{ item.name }}</td>
            <td>{{ item.description }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="3" class="text-center">No data available yet</td>
        </tr>
        {% endfor %}
    </tbody>
</table>

{% endblock %}
