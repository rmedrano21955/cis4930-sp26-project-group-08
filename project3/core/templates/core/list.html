{% extends 'core/base.html' %}

{% block title %}Records{% endblock %}

{% block content %}
<h1 class="mb-4">Data Records</h1>
<p><a href="{% url 'record-add' %}" class="btn btn-primary">Create a new record</a></p>

<ul class="list-group mt-3">
    {% for record in records %}
    <li class="list-group-item d-flex justify-content-between align-items-center">
        <a href="{% url 'record-detail' record.pk %}">{{ record.name }}</a>
        <span class="badge bg-secondary">{{ record.source }}</span>
    </li>
    {% empty %}
    <li class="list-group-item">No records yet.</li>
    {% endfor %}
</ul>
{% endblock %}
