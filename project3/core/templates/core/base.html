{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Project 3{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="container py-4">
    <nav class="navbar rounded">
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'record-list' %}">Records</a>
        <a href="{% url 'analytics' %}">Analytics</a>
        <a href="{% url 'movie-list' %}">Movies</a>
        <a href="{% url 'record-add' %}">Add New</a>
    </nav>

    {% if messages %}
    <div class="messages mb-4">
        {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
    </div>
    {% endif %}

    {% block content %}
    {% endblock %}

    <footer class="mt-5 pt-3 border-top">
        <p class="text-muted small">Group 08 Project 3</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
