{% extends 'core/base.html' %}

{% block title %}Delete Record - Data Web App{% endblock %}

{% block content %}
<div class="row">
    <div class="col-lg-6 mx-auto">
        <div class="card shadow-sm border-danger">
            <div class="card-header bg-danger text-white py-3">
                <h2 class="h5 mb-0">Confirm Deletion</h2>
            </div>
            <div class="card-body py-4 text-center">
                <p class="lead mb-4">Are you sure you want to delete this record?</p>
                <div class="bg-light p-3 rounded mb-4">
                    <p class="mb-0 fw-bold">Record ID: {{ record.id }}</p>
                    <p class="mb-0 text-muted">{{ record.name }}</p>
                </div>
                <p class="text-danger mb-4 small"><i class="bi bi-exclamation-triangle"></i> This action can't be undone.</p>
                
                <form method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-3">
                        <a href="{% url 'record-detail' record.pk %}" class="btn btn-outline-secondary">Cancel</a>
                        <button type="submit" class="btn btn-danger px-4">Delete Permanently</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
