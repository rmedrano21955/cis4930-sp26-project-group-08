{% extends 'core/base.html' %}
{% block title %}Delete {{ movie.title }}{% endblock %}

{% block content %}

<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card shadow-sm border-danger">
      <div class="card-header bg-danger text-white">
        <h4 class="mb-0">Confirm Delete</h4>
      </div>
      <div class="card-body">
        <p class="mb-4">Are you sure you want to delete <strong>{{ movie.title }}</strong>? This cannot be undone.</p>
        <form method="post">
          {% csrf_token %}
          <button type="submit" class="btn btn-danger">Yes, Delete</button>
          <a href="{% url 'movie-list' %}" class="btn btn-secondary ms-2">Cancel</a>
        </form>
      </div>
    </div>
  </div>
</div>

{% endblock %}
