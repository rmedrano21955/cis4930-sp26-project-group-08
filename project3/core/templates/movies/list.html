<h1>Movies</h1>

<a href="{% url 'movie-create' %}">Add Movie</a>

<ul>
{% for movie in movies %}
    <li>
        {{ movie.title }} ({{ movie.year }})

        <a href="{% url 'movie-detail' movie.id %}">View</a>
        <a href="{% url 'movie-update' movie.id %}">Edit</a>
        <a href="{% url 'movie-delete' movie.id %}">Delete</a>
    </li>
{% endfor %}
</ul>
