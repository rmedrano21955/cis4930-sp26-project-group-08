{% extends 'core/base.html' %}

{% block title %}Movies{% endblock %}

{% block content %}

<h2 class="mb-3">Movies</h2>
<a href="{% url 'movie-create' %}" class="btn btn-primary mb-3">Add Movie</a>

<table class="table table-striped table-hover table-bordered align-middle">
  <thead class="table-dark">
    <tr>
      <th>Title</th>
      <th>Year</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    {% for movie in movies %}
    <tr>
      <td>{{ movie.title }}</td>
      <td>{{ movie.year }}</td>
      <td>
        <a class="btn btn-sm btn-info" href="{% url 'movie-detail' movie.id %}">View</a>
        <a class="btn btn-sm btn-warning" href="{% url 'movie-update' movie.id %}">Edit</a>
        <a class="btn btn-sm btn-danger" href="{% url 'movie-delete' movie.id %}">Delete</a>
      </td>
    </tr>
    {% empty %}
    <tr><td colspan="3">No movies yet.</td></tr>
    {% endfor %}
  </tbody>
</table>

{% endblock %}
